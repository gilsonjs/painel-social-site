<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Painel de Redes Sociais</title>
<style>
:root {
  --fundo: #0f0f0f;
  --cartao: #1a1a1a;
  --borda: #2a2a2a;
  --texto: #ffffff;
  --texto2: #888888;
  --texto3: #555555;
  --azul: #3b82f6;
  --verde: #22c55e;
  --vermelho: #ef4444;
}
@media (prefers-color-scheme: light) {
  :root {
    --fundo: #f5f5f5;
    --cartao: #ffffff;
    --borda: #e0e0e0;
    --texto: #111111;
    --texto2: #555555;
    --texto3: #999999;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--fundo);
  color: var(--texto);
  padding: 16px;
  min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; }
.cabecalho {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.titulo { font-size: 22px; font-weight: 600; }
.ao-vivo {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--verde);
  font-weight: 500;
}
.bolinha {
  width: 8px; height: 8px;
  background: var(--verde);
  border-radius: 50%;
  animation: pulsar 2s infinite;
}
@keyframes pulsar { 0%,100%{opacity:1} 50%{opacity:0.3} }
.atualizacao { font-size: 11px; color: var(--texto3); }
.abas {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--borda);
  padding-bottom: 10px;
  overflow-x: auto;
}
.aba-btn {
  padding: 10px 18px;
  border-radius: 8px;
  border: 1px solid var(--borda);
  background: var(--cartao);
  color: var(--texto2);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  -webkit-tap-highlight-color: rgba(59,130,246,0.2);
  min-height: 44px;
}
.aba-btn:hover, .aba-btn:active {
  color: var(--texto);
  border-color: var(--azul);
}
.aba-btn.ativa {
  color: var(--texto);
  background: var(--borda);
  border-color: var(--azul);
}
.notificacao {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--vermelho);
  color: white;
  font-size: 10px;
  margin-left: 4px;
}
.numeros {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
@media(min-width:768px){ .numeros{ grid-template-columns: repeat(4,1fr); } }
.cartao {
  background: var(--cartao);
  border: 1px solid var(--borda);
  border-radius: 12px;
  padding: 16px;
}
.cartao-titulo {
  font-size: 11px;
  color: var(--texto3);
  margin-bottom: 8px;
}
.cartao-numero {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.cartao-variacao { font-size: 11px; font-weight: 500; }
.subiu { color: var(--verde); }
.caiu { color: var(--vermelho); }
.conteudo {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media(min-width:768px){ .conteudo{ grid-template-columns: 2fr 1fr; } }
.painel {
  background: var(--cartao);
  border: 1px solid var(--borda);
  border-radius: 12px;
  padding: 16px;
}
.painel-titulo {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.grafico-container { height: 180px; position: relative; }
.grafico-svg { width: 100%; height: 100%; }
.linha-grafico {
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.area-grafico { opacity: 0.12; }
.grade-grafico {
  stroke: var(--borda);
  stroke-width: 0.5;
  stroke-dasharray: 4,4;
}
.ponto-grafico {
  fill: var(--cartao);
  stroke-width: 2;
  r: 4;
}
.feed-lista { display: flex; flex-direction: column; gap: 10px; }
.feed-item {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--borda);
  animation: entrar 0.4s ease-out;
}
.feed-item.novo {
  border-color: var(--azul);
  background: rgba(59,130,246,0.04);
}
@keyframes entrar {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.feed-cabecalho {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.feed-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--borda);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
}
.feed-autor { font-size: 13px; font-weight: 500; }
.feed-tempo { font-size: 10px; color: var(--texto3); }
.feed-texto {
  font-size: 12px;
  line-height: 1.5;
  color: var(--texto2);
  margin-bottom: 8px;
}
.feed-stats {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--texto3);
}
</style>
</head>
<body>
<div class="container">
  <div class="cabecalho">
    <h1 class="titulo">📊 Painel Social</h1>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="ao-vivo"><span class="bolinha"></span>Ao vivo</span>
      <span class="atualizacao">Atualizado há <span id="segundos">0</span>s</span>
    </div>
  </div>

  <div class="abas" id="abas">
    <button class="aba-btn ativa" onclick="trocarRede('twitter')" type="button">
      🐦 Twitter/X<span class="notificacao" id="badge-twitter">3</span>
    </button>
    <button class="aba-btn" onclick="trocarRede('instagram')" type="button">
      📸 Instagram<span class="notificacao" id="badge-instagram" style="display:none">0</span>
    </button>
    <button class="aba-btn" onclick="trocarRede('youtube')" type="button">
      ▶️ YouTube<span class="notificacao" id="badge-youtube" style="display:none">0</span>
    </button>
  </div>

  <div class="numeros">
    <div class="cartao">
      <div class="cartao-titulo">👥 Seguidores</div>
      <div class="cartao-numero" id="seguidores">24.5K</div>
      <div class="cartao-variacao subiu" id="var-seguidores">▲ +2.4%</div>
    </div>
    <div class="cartao">
      <div class="cartao-titulo">❤️ Curtidas</div>
      <div class="cartao-numero" id="curtidas">1.2K</div>
      <div class="cartao-variacao subiu" id="var-curtidas">▲ +12%</div>
    </div>
    <div class="cartao">
      <div class="cartao-titulo">💬 Comentários</div>
      <div class="cartao-numero" id="comentarios">342</div>
      <div class="cartao-variacao subiu" id="var-comentarios">▲ +5.1%</div>
    </div>
    <div class="cartao">
      <div class="cartao-titulo">🔄 Compartilhamentos</div>
      <div class="cartao-numero" id="compartilhamentos">89</div>
      <div class="cartao-variacao subiu" id="var-compartilhamentos">▲ +8.3%</div>
    </div>
  </div>

  <div class="conteudo">
    <div class="painel">
      <div class="painel-titulo">
        <span>📈 Crescimento (7 dias)</span>
        <span>📊</span>
      </div>
      <div class="grafico-container">
        <svg class="grafico-svg" id="grafico" viewBox="0 0 400 180" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gradArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--azul)" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="var(--azul)" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g id="grade"></g>
          <path id="area" class="area-grafico" fill="url(#gradArea)"/>
          <path id="linha" class="linha-grafico" stroke="var(--azul)"/>
          <g id="pontos"></g>
        </svg>
      </div>
    </div>
    <div class="painel">
      <div class="painel-titulo">
        <span>🔔 Atividade recente</span>
        <span class="ao-vivo"><span class="bolinha"></span>Novo</span>
      </div>
      <div class="feed-lista" id="feed"></div>
    </div>
  </div>
</div>

<script>
var redes = {
  twitter: {
    seguidores: 24500, curtidas: 1200, comentarios: 342, compartilhamentos: 89,
    cor: "#3b82f6",
    historico: [18000,19500,21000,20500,22000,23000,24500],
    posts: [
      {autor:"TechDaily",avatar:"TD",texto:"Novo update do algoritmo promete revolucionar o feed...",tempo:"2m",curtidas:234,comentarios:45,compartilhamentos:12},
      {autor:"DesignHub",avatar:"DH",texto:"10 tendências de UI que você não pode ignorar em 2026",tempo:"15m",curtidas:189,comentarios:23,compartilhamentos:8},
      {autor:"CodeLife",avatar:"CL",texto:"Thread: como otimizar suas queries em 3 passos simples",tempo:"1h",curtidas:567,comentarios:89,compartilhamentos:45}
    ]
  },
  instagram: {
    seguidores: 45100, curtidas: 3400, comentarios: 156, compartilhamentos: 234,
    cor: "#ef4444",
    historico: [38000,39500,41000,40500,42000,43500,45100],
    posts: [
      {autor:"fotografia_br",avatar:"FB",texto:"Golden hour em São Paulo 🌇 #photography",tempo:"5m",curtidas:1203,comentarios:34,compartilhamentos:12},
      {autor:"foodie_rj",avatar:"FR",texto:"Receita de hoje: risoto de limão siciliano",tempo:"32m",curtidas:892,comentarios:56,compartilhamentos:8},
      {autor:"travel.world",avatar:"TW",texto:"Patagônia é surreal 😍",tempo:"2h",curtidas:2341,comentarios:89,compartilhamentos:45}
    ]
  },
  youtube: {
    seguidores: 128000, curtidas: 5600, comentarios: 890, compartilhamentos: 120,
    cor: "#22c55e",
    historico: [110000,115000,118000,120000,122000,125000,128000],
    posts: [
      {autor:"CanalTech",avatar:"CT",texto:"Review completo: o novo gadget que promete mudar tudo",tempo:"10m",curtidas:3400,comentarios:234,compartilhamentos:56},
      {autor:"DevSampa",avatar:"DS",texto:"Tutorial: construindo uma API em 15 minutos",tempo:"45m",curtidas:1200,comentarios:89,compartilhamentos:23},
      {autor:"CulináriaFácil",avatar:"CF",texto:"3 receitas de café da manhã em 5 minutos",tempo:"3h",curtidas:5600,comentarios:123,compartilhamentos:45}
    ]
  }
};

var redeAtual = "twitter";
var segundos = 0;

function formatarNumero(num) {
  if (num >= 1000000) return (num/1000000).toFixed(1)+"M";
  if (num >= 1000) return (num/1000).toFixed(1)+"K";
  return num.toString();
}

function animarNumero(id, inicio, fim, duracao) {
  var el = document.getElementById(id);
  var diff = fim - inicio;
  var inicioT = performance.now();
  function atualizar(t) {
    var p = Math.min((t - inicioT)/duracao, 1);
    var s = 1 - Math.pow(1-p, 3);
    el.textContent = formatarNumero(Math.floor(inicio + diff*s));
    if (p < 1) requestAnimationFrame(atualizar);
  }
  requestAnimationFrame(atualizar);
}

function desenharGrafico(rede) {
  var dados = redes[rede].historico;
  var W = 400, H = 180, M = 20;
  var max = Math.max.apply(null, dados)*1.1;
  var min = Math.min.apply(null, dados)*0.9;
  var pts = [];
  for (var i=0; i<dados.length; i++) {
    var x = M + (i/(dados.length-1))*(W-M*2);
    var y = H - M - ((dados[i]-min)/(max-min))*(H-M*2);
    pts.push([x,y]);
  }
  var grade = document.getElementById("grade");
  grade.innerHTML = "";
  for (var i=0; i<=4; i++) {
    var y = M + (i/4)*(H-M*2);
    var ln = document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1",M); ln.setAttribute("y1",y);
    ln.setAttribute("x2",W-M); ln.setAttribute("y2",y);
    ln.setAttribute("class","grade-grafico");
    grade.appendChild(ln);
  }
  var pathL = "";
  for (var i=0; i<pts.length; i++) {
    pathL += (i===0?"M":"L") + pts[i][0] + "," + pts[i][1];
  }
  document.getElementById("linha").setAttribute("d",pathL);
  document.getElementById("linha").setAttribute("stroke",redes[rede].cor);
  var pathA = pathL + " L"+pts[pts.length-1][0]+","+(H-M)+" L"+pts[0][0]+","+(H-M)+" Z";
  document.getElementById("area").setAttribute("d",pathA);
  var g = document.getElementById("pontos");
  g.innerHTML = "";
  for (var i=0; i<pts.length; i++) {
    var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",pts[i][0]); c.setAttribute("cy",pts[i][1]);
    c.setAttribute("class","ponto-grafico");
    c.setAttribute("stroke",redes[rede].cor);
    var tt = document.createElementNS("http://www.w3.org/2000/svg","title");
    tt.textContent = formatarNumero(dados[i]);
    c.appendChild(tt); g.appendChild(c);
  }
}

function mostrarFeed(rede) {
  var lista = document.getElementById("feed");
  lista.innerHTML = "";
  for (var i=0; i<redes[rede].posts.length; i++) {
    var post = redes[rede].posts[i];
    var item = document.createElement("div");
    item.className = "feed-item" + (i===0?" novo":"");
    item.innerHTML = 
      '<div class="feed-cabecalho">'+
        '<div class="feed-avatar">'+post.avatar+'</div>'+
        '<div>'+
          '<div class="feed-autor">'+post.autor+'</div>'+
          '<div class="feed-tempo">'+post.tempo+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="feed-texto">'+post.texto+'</div>'+
      '<div class="feed-stats">'+
        '<span>❤️ '+formatarNumero(post.curtidas)+'</span>'+
        '<span>💬 '+post.comentarios+'</span>'+
        '<span>🔄 '+post.compartilhamentos+'</span>'+
      '</div>';
    lista.appendChild(item);
  }
}

function trocarRede(rede) {
  redeAtual = rede;
  var btns = document.querySelectorAll(".aba-btn");
  for (var i=0; i<btns.length; i++) {
    btns[i].classList.remove("ativa");
    if (btns[i].getAttribute("onclick").indexOf("'"+rede+"'") > -1) {
      btns[i].classList.add("ativa");
    }
  }
  var r = redes[rede];
  document.getElementById("seguidores").textContent = formatarNumero(r.seguidores);
  document.getElementById("curtidas").textContent = formatarNumero(r.curtidas);
  document.getElementById("comentarios").textContent = formatarNumero(r.comentarios);
  document.getElementById("compartilhamentos").textContent = formatarNumero(r.compartilhamentos);
  document.getElementById("seguidores").dataset.valor = r.seguidores;
  document.getElementById("curtidas").dataset.valor = r.curtidas;
  document.getElementById("comentarios").dataset.valor = r.comentarios;
  document.getElementById("compartilhamentos").dataset.valor = r.compartilhamentos;
  desenharGrafico(rede);
  mostrarFeed(rede);
}

function atualizarNumeros() {
  var r = redes[redeAtual];
  var antigos = {
    seguidores: parseInt(document.getElementById("seguidores").dataset.valor||r.seguidores),
    curtidas: parseInt(document.getElementById("curtidas").dataset.valor||r.curtidas),
    comentarios: parseInt(document.getElementById("comentarios").dataset.valor||r.comentarios),
    compartilhamentos: parseInt(document.getElementById("compartilhamentos").dataset.valor||r.compartilhamentos)
  };
  r.seguidores += Math.floor(Math.random()*40)+5;
  r.curtidas += Math.floor(Math.random()*25)+3;
  r.comentarios += Math.floor(Math.random()*6)+1;
  r.compartilhamentos += Math.floor(Math.random()*4);
  r.historico.shift(); r.historico.push(r.seguidores);
  animarNumero("seguidores",antigos.seguidores,r.seguidores,700);
  animarNumero("curtidas",antigos.curtidas,r.curtidas,700);
  animarNumero("comentarios",antigos.comentarios,r.comentarios,700);
  animarNumero("compartilhamentos",antigos.compartilhamentos,r.compartilhamentos,700);
  document.getElementById("seguidores").dataset.valor = r.seguidores;
  document.getElementById("curtidas").dataset.valor = r.curtidas;
  document.getElementById("comentarios").dataset.valor = r.comentarios;
  document.getElementById("compartilhamentos").dataset.valor = r.compartilhamentos;
  var vars = [
    {id:"var-seguidores",max:5},{id:"var-curtidas",max:15},
    {id:"var-comentarios",max:8},{id:"var-compartilhamentos",max:10}
  ];
  for (var i=0; i<vars.length; i++) {
    var el = document.getElementById(vars[i].id);
    var up = Math.random()>0.25;
    var val = (Math.random()*vars[i].max).toFixed(1);
    el.className = "cartao-variacao " + (up?"subiu":"caiu");
    el.textContent = (up?"▲ +":"▼ -")+val+"%";
  }
  desenharGrafico(redeAtual);
}

function adicionarPost() {
  var r = redes[redeAtual];
  var autores = ["UserOne","TechGuru","CreativeLab","NewsBr","DevTeam","DesignPro"];
  var textos = [
    "Acabei de publicar um novo artigo sobre tendências tech! 🚀",
    "Alguém mais está animado para o lançamento de amanhã?",
    "Dica rápida: use sempre semântica HTML correta.",
    "Novo projeto no ar! Feedback é bem-vindo 💬",
    "Thread sobre otimização de performance 🧵",
    "Qual framework vocês estão usando em 2026?"
  ];
  var np = {
    autor: autores[Math.floor(Math.random()*autores.length)],
    avatar: autores[Math.floor(Math.random()*autores.length)].substring(0,2).toUpperCase(),
    texto: textos[Math.floor(Math.random()*textos.length)],
    tempo: "agora",
    curtidas: Math.floor(Math.random()*80)+10,
    comentarios: Math.floor(Math.random()*15)+1,
    compartilhamentos: Math.floor(Math.random()*8)
  };
  r.posts.unshift(np);
  if (r.posts.length>5) r.posts.pop();
  mostrarFeed(redeAtual);
  var b = document.getElementById("badge-"+redeAtual);
  b.textContent = parseInt(b.textContent||0)+1;
  b.style.display = "inline-flex";
}

trocarRede("twitter");

setInterval(function(){
  atualizarNumeros();
  if (Math.random()>0.5) adicionarPost();
  segundos = 0;
}, 5000);

setInterval(function(){
  segundos++;
  document.getElementById("segundos").textContent = segundos;
}, 1000);
</script>
</body>
</html>
